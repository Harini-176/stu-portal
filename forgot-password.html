<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Student Portal</title>

    <link rel="stylesheet" href="style.css?v=24.0">
</head>

<body class="auth-page">

<div class="card-container">

    <div class="card">

        <div class="logo">SP</div>

        <h1>Reset Password</h1>
        <p class="subtitle">
            Enter your student ID and registered email to set a new password.
        </p>

        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="resetStudentId">Student ID or Register No</label>
                <input
                    type="text"
                    id="resetStudentId"
                    placeholder="e.g. student or RA202510008"
                    required
                >
            </div>

            <div class="input-group">
                <label for="resetEmail">Registered Email</label>
                <input
                    type="email"
                    id="resetEmail"
                    placeholder="e.g. student@example.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password (min. 4 characters)"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter new password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Update Password
            </button>

            <p id="resetMessage" class="message"></p>

            <div class="back-link-container">
                <a href="index.html" class="back-link">
                    ← Back to Login
                </a>
            </div>
        </form>

        <div class="footer">
            © 2026 Student Portal
        </div>

    </div>

</div>

<script src="script.js?v=24.0" defer></script>
</body>
</html>

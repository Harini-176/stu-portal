<!DOCTYPE html>

<body>

<div class="container">

                <div class="logo">
                    <div class="logo-icon">SP</div>
                    <div class="logo-text">
                        <h1>Student Portal</h1>
                    </div>
                </div>
                <button type="button" class="close-sidebar-btn" id="closeSidebarBtn" title="Exit Menu">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <span>Exit</span>
                </button>
            </div>

            <nav class="menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="attendance.html">Attendance</a>
                <a href="subject.html" class="active">Subjects</a>
                <a href="timetable.html">Timetable</a>
                <a href="Previous-Year-Marks.html">Previous Year Marks</a>
                <a href="personal-details.html">Personal Details</a>
                <a href="course-list.html">Course List</a>

                    <h1>Subjects</h1>
                    <p>View your enrolled academic subjects</p>
                </div>
            </div>
        </div>

        <!-- SUBJECTS LIST -->
        <div class="subjects" id="subjectsList">
            <!-- Rendered dynamically by subject.js -->
        </div>

    </main>

</div>

<script src="script.js?v=24.0" defer></script>
<script src="subject.js?v=24.0" defer></script>
